# Ghostty (macOS) — incluído por ~/.config/ghostty/config via `config-file`.
# Fonte da verdade: casara-ai-utils/terminal/ (ver README.md).
# Espelha o perfil zsh do Windows Terminal: mesma fonte, cursor e paleta Tango Dark.

font-family = JetBrainsMono Nerd Font
font-size = 13
cursor-style = bar
window-padding-x = 8
window-padding-y = 8
command = /bin/zsh -l -i

# Tango Dark (o mesmo esquema do Windows Terminal)
background = #000000
foreground = #d3d7cf
cursor-color = #ffffff
selection-background = #ffffff
selection-foreground = #000000
palette = 0=#000000
palette = 1=#cc0000
palette = 2=#4e9a06
palette = 3=#c4a000
palette = 4=#3465a4
palette = 5=#75507b
palette = 6=#06989a
palette = 7=#d3d7cf
palette = 8=#555753
palette = 9=#ef2929
palette = 10=#8ae234
palette = 11=#fce94f
palette = 12=#729fcf
palette = 13=#ad7fa8
palette = 14=#34e2e2
palette = 15=#eeeeec
